<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4e89">
<title>Scan – Librairie des Princes</title>
<style>
:root{--bg:#f6f3ee;--ink:#1f2430;--muted:#6b7080;--line:#e3ded5;--accent:#1d4e89;--hl:#e8590c;--hl-soft:#ffe8d9;--ok:#2b8a3e;--bad:#c92a2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--accent);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:16px;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:13px}
#cam{position:relative;height:38vh;background:#111;overflow:hidden}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .guide{position:absolute;left:10%;right:10%;top:50%;height:0;border-top:2px solid #ff6b6b;box-shadow:0 0 8px #ff6b6b}
#cam .frame{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.7);border-radius:10px}
#cam .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-size:15px}
#cam .msg:not(:empty){background:rgba(0,0,0,.75)}
#cam.flash .frame{border-color:#51cf66;box-shadow:0 0 0 4px rgba(81,207,102,.4)}
main{padding:12px;max-width:700px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.res{display:flex;gap:12px;align-items:center}
.zb{flex:none;min-width:70px;text-align:center;background:var(--hl);color:#fff;border-radius:12px;padding:8px 6px;font-weight:800;font-size:28px;line-height:1}
.zb small{display:block;font-size:10px;font-weight:700;opacity:.9}
.zb.none{background:#adb5bd}
.t{font-weight:700;font-size:17px}.lvl{color:var(--accent);font-weight:650}.m{color:var(--muted);font-size:13px}
.warn{color:var(--bad);font-weight:700;font-size:13px}
input.i,textarea{width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}
textarea{font-size:12px;height:120px}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:650;background:var(--accent);color:#fff}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
svg{width:100%;height:auto;max-height:42vh;display:block}
.zone rect{fill:#fff;stroke:var(--accent);stroke-width:1.2}
.zone text{font-size:9px;font-weight:700;fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.zone.hl rect{fill:var(--hl);stroke:var(--hl)}.zone.hl text{fill:#fff}
.hist{font-size:13px;color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>📷 Scan – Librairie des Princes</h1><button id="bCam">Pause</button><button id="bData">Données</button></header>
<div id="cam"><video id="v" playsinline muted></video><div class="frame"></div><div class="guide"></div><div class="msg" id="camMsg">Appuie pour démarrer la caméra</div></div>
<main>
  <div id="result"></div>
  <input class="i" id="q" placeholder="Ou tape un nom, un code, une réf, un prix…" autocomplete="off">
  <div id="list" style="margin-top:8px"></div>
  <div class="card"><svg id="svg" viewBox="0 0 360 390"></svg></div>
  <div class="hist" id="hist"></div>
  <div class="card hidden" id="dataBox">
    <b>Mettre à jour les titres</b>
    <p class="m">Dans l'appli Claude, onglet <b>Titres</b>, appuie sur <b>« Exporter pour l'appli caméra »</b>, puis colle ici et appuie sur Importer.</p>
    <textarea id="imp" placeholder="Colle les données ici"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="bImp">Importer</button><button class="btn sec" id="bClose">Fermer</button></div>
    <p class="m" id="dataInfo"></p>
  </div>
</main>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const ZONES = {
  "1":{nom:"Jeux Megastar",niv:["Jeux Megastar"],desc:"Présentoir près de la vitrine (haut) : mots fléchés, codés, casés, sudoku, pêle-mêle, casse-têtes Megastar"},
  "2":{nom:"Jeux généralistes",niv:["Jeux généralistes"],desc:"Même présentoir (bas) : Femme Actuelle Jeux, Jeux Évasion, Multijeux, Jeux en folie"},
  "3":{nom:"Sport Cérébral",niv:["Sport Cérébral"],desc:"Présentoir (haut) : fléchés, mots mêlés, casés Sport Cérébral"},
  "4":{nom:"Croisés, codés, sudoku",niv:["Croisés, codés, sudoku"],desc:"Présentoir (milieu) : croisés, codés, Binero, Tectonic, sudoku"},
  "5":{nom:"Jeux généralistes (Télé Star Jeux…)",niv:["Jeux généralistes (Télé Star Jeux…)"],desc:"Présentoir (bas) : Télé Star Jeux, Jeux Maxi, Slam, Jeux Vacances"},
  "6":{nom:"Néerlandais · Allemand · Guerre",niv:["Haut – néerlandais","Milieu – allemand","Milieu droite – italien","Bas gauche – guerre / armes","Bas droite – histoire / littérature"],desc:"Mur du fond, partie gauche"},
  "7":{nom:"Couture · Magazines des journaux",niv:["Haut – couture / création","Bas – magazines des journaux","À plat – magazines des journaux"],desc:"Présentoir devant la zone 6"},
  "8":{nom:"Bateaux · Avions · Histoire",niv:["Haut gauche – bateaux","Haut droite – avions","Milieu – histoire","Bas – histoire"],desc:"Mur du fond, partie droite"},
  "9":{nom:"Moto · Auto · Sport",niv:["Haut – moto","Auto / camping-car / tracteur","Sport auto","Sport (+ animaux, actualité)","À plat – divers"],desc:"Présentoir devant la zone 8"},
  "10":{nom:"Rock · Pays · Jardin",niv:["Haut – rock / musique","Milieu – pays / voyages","Bas – chasse / jardinage"],desc:"Mur de droite (début) — chaque étage continue en zone 12"},
  "11":{nom:"Déco/maison · People",niv:["Haut – déco / maison","Bas – people","À plat – people"],desc:"Présentoir devant la zone 10"},
  "12":{nom:"Rock · Pays · Jardin (suite)",niv:["Haut – rock / musique","Milieu – pays / voyages","Bas – chasse / jardinage"],desc:"Mur de droite (suite de la zone 10)"},
  "13":{nom:"Femme",niv:["Haut – féminins / santé","Milieu – bien-être / psycho / mode","Bas – faits divers / Dr Good","À plat – féminins"],desc:"Présentoir devant la zone 12"},
  "14":{nom:"Cuisine",niv:["Haut – cuisine / vins","Haut droite – adultes","Milieu – recettes / nutrition","Bas – cuisine"],desc:"Mur en biais vers la porte"},
  "15":{nom:"Photo · Sciences · IA · Arts · Télé",niv:["Photo / cinéma","Sciences","IA / informatique","Informatique / jeux vidéo","Arts / lecture","Sport / astrologie","À plat – télé"],desc:"Présentoir devant la zone 14"},
  "16":{nom:"Livres",niv:["Haut – nouveautés grand format","Gauche – romans poche (romance, young adult)","Droite – romans poche (polars, thrillers)"],desc:"Îlot central, côté droit : nouveautés en grand format sur le dessus (Levy, Coben, Bussi, Nothomb, Steel…), romans poche en dessous"},
  "17":{nom:"Livres (suite)",niv:["Droite – livres poche (Pocket, Livre de Poche…)","Gauche – grands formats et divers","Haut – dépliants et cartes de visite"],desc:"Îlot central, bout du bas : le reste des livres, surtout des poches à droite et quelques grands formats à gauche"},
  "18":{nom:"Livres enfants",niv:["Gauche – livres enfants / activités","Droite – magazines jeunesse (goodies)","Extension – BD et magazines jeunesse","Haut – livres"],desc:"Îlot central, côté gauche : livres enfants à gauche, magazines jeunesse avec cadeaux à droite, puis l'extension (Mickey, Picsou, Spirou collection, J'aime lire, Pomme d'Api, Astrapi, Youpi…)"},
  "19":{nom:"Journaux",niv:["Gauche – journaux belges","Droite – journaux internationaux"],desc:"Îlot central, bout du haut. Face au meuble : à gauche les belges, à droite les internationaux"},
};
ZONES["10/12"]={nom:"Rock · Pays · Jardin (mur 10 → 12)",niv:ZONES["10"].niv,desc:"Mur de droite, zones 10 et 12"};

const SHAPES = [
  {z:"1",r:[26,209,20,52]},{z:"2",r:[46,207,13,50]},
  {z:"3",r:[30,80,16,70]},{z:"4",r:[46,82,16,66]},{z:"5",r:[62,82,20,62]},
  {z:"6",r:[62,17,90,12]},{z:"7",r:[64,31,87,9]},
  {z:"8",r:[152,15,82,12]},{z:"9",r:[153,29,52,9]},
  {z:"10",r:[221,28,13,84]},{z:"11",r:[205,44,13,68]},
  {z:"12",r:[221,114,13,90]},{z:"13",r:[203,114,15,96]},
  {z:"19",r:[108,86,58,11]},{z:"18",r:[113,99,10,82]},{z:"16",r:[148,99,10,82]},{z:"17",r:[104,183,62,20]},
  {z:"14",r:[238,210,112,12],rot:[40,238,210]},{z:"15",r:[226,226,96,12],rot:[40,226,226]},
];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
const digits=s=>String(s||"").replace(/\D/g,"");
const euro=p=>p==null||p===""?"":Number(p).toFixed(2).replace(".",",")+" €";
const zoneLabel=z=>!z?"?":(z==="10/12"?"10-12":z);
const zoneParts=z=>!z?[]:(z==="10/12"?["10","12"]:[z]);

let TITLES=[]; // [{id,...}]
function load(){ try{ const d=JSON.parse(localStorage.getItem("titres")||"null"); if(d&&Array.isArray(d.titres)){TITLES=d.titres; $("dataInfo").textContent=`${TITLES.length} titres, mis à jour le ${d.date}`; return;} }catch(e){} TITLES=[]; }
load();

function drawPlan(z){
  let h=`<path d="M30,14 L238,9 L238,205 L350,298 Q338,356 262,378 L88,382 L20,340 L20,60 Z" fill="#fbfaf7" stroke="#8a8f99" stroke-width="2"/>`;
  h+=`<circle cx="34" cy="176" r="7" fill="#fff" stroke="#adb5bd"/><circle cx="34" cy="195" r="7" fill="#fff" stroke="#adb5bd"/>`;
  const parts=zoneParts(z);
  for(const s of SHAPES){const [x,y,w,hh]=s.r; const tr=s.rot?` transform="rotate(${s.rot.join(" ")})"`:"";
    h+=`<g class="zone ${parts.includes(s.z)?"hl":""}"${tr}><rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="2"/><text x="${x+w/2}" y="${y+hh/2}">${s.z}</text></g>`;}
  $("svg").innerHTML=h;
}
drawPlan("");

function byCode(code){
  const d=digits(code); if(d.length<8) return null;
  const k13=d.slice(0,13), k10=d.slice(0,10);
  let t=TITLES.find(t=>(t.eans||[]).some(e=>digits(e).slice(0,13)===k13)); if(t) return t;
  const h=TITLES.filter(t=>(t.eans||[]).some(e=>digits(e).slice(0,10)===k10)); return h.length===1?h[0]:null;
}
function search(q){
  q=q.trim(); if(!q) return [];
  const pm=q.replace(/\s*€/,"").match(/^(\d{1,3})[.,](\d{1,2})$/);
  if(pm){const p=Number(pm[1]+"."+pm[2]); return TITLES.filter(t=>t.prix!=null&&Math.abs(t.prix-p)<.001);}
  const d=digits(q);
  if(d.length>=8&&d.length===q.replace(/\s/g,"").length){const t=byCode(d); return t?[t]:TITLES.filter(t=>(t.eans||[]).some(e=>digits(e).includes(d)));}
  const rq=q.replace(/^\*/,"").toUpperCase(); const out=[];
  if(/\d/.test(q)&&q.length<=8) TITLES.forEach(t=>{if(String(t.ref||"").replace(/^\*/,"").toUpperCase()===rq) out.push(t)});
  const toks=norm(q).split(" ").filter(Boolean);
  if(/[A-Z]/i.test(q)) TITLES.forEach(t=>{const n=norm(t.nom); if(toks.every(k=>n.includes(k))&&!out.includes(t)) out.push(t)});
  return out.slice(0,40);
}
function card(t,big){
  return `<div class="card res" ${big?'style="border:2px solid var(--hl)"':""}><div class="zb ${t.zone?"":"none"}"><small>ZONE</small>${esc(zoneLabel(t.zone))}</div>
   <div><div class="t">${esc(t.nom)}</div><div class="lvl">${esc(t.niveau||t.categorie||"Emplacement à définir")}</div>
   <div class="m">${[euro(t.prix),t.ref?"réf "+t.ref:"",t.maxRetour!=null?"max retour "+t.maxRetour:""].filter(Boolean).map(esc).join(" · ")}${t.note?" · "+esc(t.note):""}</div></div></div>`;
}
const hist=[];
function show(code){
  const t=byCode(code);
  if(t){ $("result").innerHTML=card(t,true); drawPlan(t.zone); }
  else $("result").innerHTML=`<div class="card"><div class="t">Code inconnu</div><div class="m">${esc(code)}</div><div class="m">Ajoute ce titre dans l'appli Claude, puis mets à jour les données ici.</div></div>`;
  hist.unshift((t?t.nom+" → "+zoneLabel(t.zone):"? "+code)); hist.splice(6);
  $("hist").innerHTML="Derniers scans : "+hist.map(esc).join(" · ");
  if(!TITLES.length) $("result").innerHTML+=`<div class="card warn">Aucune donnée : appuie sur « Données » pour importer les titres.</div>`;
}
$("q").addEventListener("input",()=>{const r=search($("q").value); $("list").innerHTML=r.map(t=>card(t)).join(""); if(r.length===1) drawPlan(r[0].zone);});

/* Caméra en direct */
let stream=null, running=false, last="", lastAt=0, zx=null, detector=null;
function onCode(raw){
  const code=digits(raw)||raw; const now=Date.now();
  if(code===last&&now-lastAt<2500) return; last=code; lastAt=now;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  $("cam").classList.add("flash"); setTimeout(()=>$("cam").classList.remove("flash"),300);
  show(code);
}
async function start(){
  $("camMsg").textContent="Démarrage…";
  try{
    if("BarcodeDetector" in window){
      const f=await BarcodeDetector.getSupportedFormats(); detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"].filter(x=>f.includes(x))});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}},audio:false});
      $("v").srcObject=stream; await $("v").play(); running=true; $("camMsg").textContent=""; loop();
    }else{
      zx=new ZXing.BrowserMultiFormatReader(new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]]]),150);
      await zx.decodeFromConstraints({video:{facingMode:"environment"}},$("v"),(r)=>{ if(r) onCode(r.getText()); });
      running=true; $("camMsg").textContent="";
    }
    $("bCam").textContent="Pause";
  }catch(e){ $("camMsg").textContent="Caméra refusée ou indisponible. Autorise la caméra pour ce site dans le navigateur, puis appuie ici."; running=false; }
}
async function loop(){
  if(!running||!detector) return;
  try{ const r=await detector.detect($("v")); if(r&&r.length) onCode(r.sort((a,b)=>b.rawValue.length-a.rawValue.length)[0].rawValue); }catch(e){}
  setTimeout(loop,120);
}
function stop(){ running=false; if(zx){try{zx.reset()}catch(e){} zx=null;} if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} $("camMsg").textContent="Caméra en pause – appuie pour reprendre"; $("bCam").textContent="Scanner"; }
$("cam").onclick=()=>{ if(!running) start(); };
$("bCam").onclick=()=>running?stop():start();
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&running) stop(); });

/* Données */
$("bData").onclick=()=>$("dataBox").classList.toggle("hidden");
$("bClose").onclick=()=>$("dataBox").classList.add("hidden");
$("bImp").onclick=()=>{
  try{ const d=JSON.parse($("imp").value.trim()); const arr=Array.isArray(d)?d:d.titres; if(!Array.isArray(arr)||!arr.length) throw 0;
    const obj={date:d.date||new Date().toISOString().slice(0,10),titres:arr}; localStorage.setItem("titres",JSON.stringify(obj)); load();
    $("imp").value=""; $("dataInfo").textContent=`✓ ${TITLES.length} titres importés`;
  }catch(e){ $("dataInfo").textContent="Ces données ne sont pas valides. Recopie tout le texte exporté."; }
};
if(!TITLES.length) $("dataBox").classList.remove("hidden");
start();
</script>
</body>
</html>
